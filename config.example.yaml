# Aktenfux – Example Configuration
# Copy this file to config.yaml and adjust the paths and settings.

# Base directory for all Aktenfux working folders.
# Tilde (~) is expanded to the user's home directory.
base_dir: "~/Documents/Aktenfux"

# Sub-folder names (relative to base_dir)
inbox_dir: "_Inbox"
review_dir: "_Review"
imported_dir: "_Imported"
error_dir: "_Error"
archive_dir: "Archive"
# Folder for approved documents that are likely multi-document scans and need splitting.
split_dir: "_Split"
# Folder where sidecar JSON files are written during dry-run scans.
dry_run_dir: "_DryRun"

# Ollama settings
# FIRST-RELEASE TARGET: keep this on a loopback address. The current MVP does
# not enforce loopback-only access; a LAN or internet URL sends OCR text and
# summaries to that endpoint and may use plaintext HTTP.
ollama_url: "http://localhost:11434"
ollama_model: "qwen3:8b"
# Timeout in seconds for LLM inference calls (increase for slower hardware or larger models).
ollama_timeout: 120

# dry_run is ON by default, but it is not currently a safety boundary.
# CURRENT MVP WARNING: scanning in dry-run writes a model-named JSON result;
# traversal or an absolute model filename can escape _DryRun and replace a file.
# Use only synthetic, disposable data until mutation-free dry-run is implemented.
dry_run: true

# Maximum characters of OCR text sent to the LLM.
max_chars_for_llm: 12000

# Language for summaries (e.g. "de" for German, "en" for English)
language: "de"

# Write an additional human-readable Markdown summary next to the sidecar JSON.
write_markdown_summary: false

# UNSUPPORTED FOR THE FIRST RELEASE: keep this false.
# Enabling it rewrites PDF bytes after the recorded SHA-256 was calculated, so
# the stored hash becomes stale even though the visible page content is unchanged.
# A later ADR and implementation change are required before this is safe to use.
write_pdf_metadata: false

# Optional SQLite index for status, IDs, history, and duplicate detection.
# Core functionality works without SQLite.
use_sqlite_index: false
# CURRENT MVP WARNING: this path is not confined before database access. Keep it
# as a simple relative filename; absolute paths and traversal can write outside
# base_dir until exact-root validation is implemented.
sqlite_path: "aktenfux.db"

# Allowed top-level categories for document classification.
allowed_top_level_categories:
  - Taxes
  - Banking
  - Insurance
  - Home
  - Car
  - Work
  - Health
  - Contracts
  - Invoices
  - Warranties
  - Other
