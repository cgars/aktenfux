name: Architecture diagrams

on:
  pull_request:
    paths:
      - "docs/architecture.md"
      - "docs/threat-model.md"
      - "package.json"
      - "package-lock.json"
      - "scripts/render_architecture.py"
      - ".github/workflows/architecture-diagrams.yml"
  push:
    branches:
      - main
    paths:
      - "docs/architecture.md"
      - "docs/threat-model.md"
      - "package.json"
      - "package-lock.json"
      - "scripts/render_architecture.py"
      - ".github/workflows/architecture-diagrams.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked Mermaid dependencies
        run: npm ci
      - name: Install Puppeteer browser revision
        run: ./node_modules/.bin/puppeteer browsers install chrome-headless-shell
      - name: Render Mermaid diagrams
        run: python scripts/render_architecture.py --puppeteer-no-sandbox
      - name: Upload SVG diagrams
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: architecture-diagrams
          path: build/architecture/*.svg
