[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aktenfux"
version = "0.1.0"
description = "A local, privacy-first document assistant for OCR-ready PDFs"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.0",
    "pypdf>=4.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "fastapi>=0.143,<0.144",
    "uvicorn>=0.54,<0.55",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx2>=2.13,<2.14",
]
watch = [
    "watchdog>=4.0",
]
pdf-extra = [
    "pdfplumber>=0.11",
]

[project.scripts]
afu = "aktenfux.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["aktenfux*"]

[tool.setuptools.package-data]
aktenfux = ["workbench.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "error::starlette.testclient.StarletteDeprecationWarning",
]
